apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-workspace
  namespace: agent-sandbox-demo
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  # Set this when the cluster's default StorageClass does not support RWX.
  # storageClassName: nfs-client

